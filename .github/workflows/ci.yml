name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Retrain from source (guards against stale or tampered model files)
        run: python -m training.train
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t spam-classifier:ci .
      - name: Smoke test container
        run: |
          docker run -d --name s -p 8000:8000 -e SPAM_API_KEYS=ci-key spam-classifier:ci
          for i in $(seq 1 20); do curl -fsS localhost:8000/readyz && break || sleep 1; done
          curl -fsS -X POST localhost:8000/v1/predict -H 'X-API-Key: ci-key' \
            -H 'Content-Type: application/json' -d '{"text":"WIN a FREE prize now, call 09061701461"}'
